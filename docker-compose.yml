# Producción: la app se conecta a las bases de datos que viven en
# /opt/neuxora/produccion/db (red idiomas_ug_red_prod).
# Los secretos vienen de .env, que el workflow copia desde
# /opt/neuxora/produccion/app/.env.

name: idiomas-ug

services:
  api:
    build: ./backend
    env_file: .env
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "0.0.0.0:80:80"
    restart: unless-stopped

networks:
  default:
    name: idiomas_ug_red_prod
    external: true