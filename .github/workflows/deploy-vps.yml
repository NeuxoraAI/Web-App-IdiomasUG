name: CI/CD Neuxora

on:
  push:
    branches: [develop, main]
    paths: ["backend/**", "frontend/**", "docker-compose*.yml", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cargar entorno de pruebas
        run: |
          cp /opt/neuxora/desarrollo/app-test.env .env.test
          chmod 600 .env.test

      - name: Build
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build

      - name: Tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm --no-deps api python -m pytest tests -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cargar secretos de producción
        run: |
          cp /opt/neuxora/produccion/app/.env .env
          chmod 600 .env

      - name: Deploy
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl